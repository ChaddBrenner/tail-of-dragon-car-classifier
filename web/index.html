<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An eight-class vehicle classifier trained on Tail of the Dragon road photography, with an interactive gallery, error analysis, and a documented stopping rule." />
    <meta name="theme-color" content="#0C0D0F" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tail of the Dragon Car Classifier" />
    <meta property="og:description" content="An eight-class car classifier at 99.12% accuracy on 23,980 held-out photographs, with a manual review of the 210 remaining misses." />

    <title>Tail of the Dragon Classifier: Training and Error Analysis</title>
    <script>
      (() => {
        const stored = localStorage.getItem("tail-dragon-theme-v1");
        const theme = stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
